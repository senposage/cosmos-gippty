#@TYPE: Machine
#@NAME: Elegoo Centauri Carbon 1
#@DESCRIPTION: Machine configuration for the Elegoo Centauri Carbon 1, based on the Allwinner R528 CPU

require conf/machine/include/sun8i.inc

DEFAULTTUNE = "cortexa7thf-neon-vfpv4"

# HelixScreen and Moonruster are installed from prebuilt ARMv7 releases.  The
# only selected CC1 Cargo package was the legacy AtomScreen UI, so avoid
# building Rust and its graphics crate graph.  The CC1 HelixScreen release is
# a statically linked EGL/GLES executable that talks to the DRM kernel device
# directly: CC1 has neither an X11 nor a Wayland desktop, nor a target-side
# OpenGL/Mesa runtime.  It also has no audio path, so omit desktop
# introspection, API documentation, and audio feature branches.  The optional radio, debugging,
# and Vulkan features below have no CC1 hardware or service consumer; Wi-Fi
# and Avahi remain selected through the base image.
DISTRO_FEATURES:remove = " \
    rust \
    alsa \
    pulseaudio \
    x11 \
    wayland \
    opengl \
    gobject-introspection-data \
    api-documentation \
    bluetooth \
    3g \
    nfc \
    debuginfod \
    vulkan \
    nfs \
    pci \
"

# The shared Allwinner machine baseline advertises ALSA, but CC1 has no sound
# hardware or audio service.  Without this removal packagegroup-base builds
# its full ALSA utility and multimedia dependency chain despite the CC1 image
# having no use for it.
MACHINE_FEATURES:remove = "alsa"

KERNEL_DEVICETREE = "allwinner/elegoo-centauri-carbon1.dtb"
KERNEL_IMAGETYPE = "zImage"
UBOOT_ENTRYPOINT = "0x43000000"
SERIAL_CONSOLES = "115200;ttyS0"
SERIAL_ADDR = "0x02500000"
KERNEL_CONSOLE  = "ttyS0,115200"

UBOOT_MACHINE = ""
UBOOT_CONFIG = "usb usb-msd emmc"
UBOOT_CONFIG[emmc]    = "elegoo_centauri_carbon1_defconfig"
UBOOT_CONFIG[usb]     = "elegoo_centauri_carbon1_defconfig"
UBOOT_CONFIG[usb-msd] = "elegoo_centauri_carbon1_defconfig"
UBOOT_CONFIG_BINARY[emmc]    = "u-boot.bin"
UBOOT_CONFIG_BINARY[usb]     = "u-boot.bin"
UBOOT_CONFIG_BINARY[usb-msd] = "u-boot.bin"
UBOOT_CONFIG_FRAGMENTS[usb]  = "usb-cc1.config"
UBOOT_CONFIG_FRAGMENTS[usb-msd] = "usb-msd-cc1.config"
