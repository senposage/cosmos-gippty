name: Validate HelixScreen and build CC1 image (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Yocto image target to build
        required: true
        default: cosmos-image-usb
        type: choice
        options:
          - cosmos-image-usb
          - cosmos-image-mmc
          - cosmos
      upload_all_artifacts:
        description: Upload the complete CC1 deployment directory
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  helixscreen-targets:
    # Validate the exact upstream release used by the Yocto recipe before
    # spending hours on the full firmware image.  CC1 is armv7.
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out HelixScreen v1.0.6 with submodules
        run: |
          git clone --depth 1 --branch v1.0.6 --recurse-submodules \
            https://github.com/prestonbrown/helixscreen.git helixscreen

      - name: Install HelixScreen build dependencies
        working-directory: helixscreen
        run: |
          # The upstream target asks before using apt; give that explicit
          # confirmation in the non-interactive hosted runner.
          printf 'y\n' | make install-deps

      - name: Build official CC1 target
        working-directory: helixscreen
        run: make cc1-docker

      - name: Upload HelixScreen CC1 binary
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: helixscreen-v1.0.6-cc1-validation
          path: helixscreen/build/cc1/bin/
          if-no-files-found: error
          retention-days: 14

  build:
    # Manual-only: a full Yocto build is resource intensive and should never
    # start merely because a branch was pushed.
    needs: helixscreen-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BB_NUMBER_THREADS: "4"
      PARALLEL_MAKE: "-j 4"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bmap-tools build-essential chrpath cpio debianutils diffstat file \
            gawk gcc git iputils-ping libegl1 liblz4-tool libsdl1.2-dev \
            locales mesa-common-dev pylint python3 python3-git python3-jinja2 \
            python3-pexpect python3-pip python3-subunit socat sunxi-tools texinfo \
            unzip wget xterm xz-utils zstd
          sudo locale-gen en_US.UTF-8

      - name: Enable user namespaces for BitBake
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor by default; BitBake needs one for network isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true

      - name: Build Centauri Carbon 1 image
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          TEMPLATECONF="$PWD/meta-opencentauri/conf/templates/opencentauri" \
            source openembedded-core/oe-init-build-env build
          MACHINE=centauri-carbon-1 bitbake ${{ inputs.target }}

      - name: Upload CC1 deployment artifacts
        if: ${{ success() && inputs.upload_all_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-${{ inputs.target }}
          path: build/tmp/deploy/images/centauri-carbon-1/
          if-no-files-found: error
          retention-days: 14

      - name: Upload BitBake logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-build-logs
          path: |
            build/tmp/log/
            build/tmp/work/**/temp/log.*
          if-no-files-found: warn
          retention-days: 14
