name: Build CC1 image (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Yocto image target to build
        required: true
        default: cosmos-image-usb
        type: choice
        options:
          - cosmos-image-usb
          - cosmos-image-mmc
          - cosmos
      upload_all_artifacts:
        description: Upload the complete CC1 deployment directory
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    # Manual-only: a full Yocto build is resource intensive and should never
    # start merely because a branch was pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BB_NUMBER_THREADS: "4"
      PARALLEL_MAKE: "-j 4"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Reclaim runner disk space
        run: |
          # GitHub-hosted runners are ephemeral.  Keep Yocto's downloads and
          # sstate in the Actions cache below; this only removes preinstalled
          # runner tooling that the CC1 image build does not use.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Restore Yocto downloads and sstate cache
        id: yocto-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          # Cache entries are immutable.  A new dispatched run writes an
          # updated entry; restore-keys selects the most recent compatible
          # cache for this CC1 workflow first.
          key: yocto-cc1-v1-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            yocto-cc1-v1-${{ github.sha }}-
            yocto-cc1-v1-

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bmap-tools build-essential chrpath cpio debianutils diffstat file \
            gawk gcc git iputils-ping libegl1 liblz4-tool libsdl1.2-dev \
            locales mesa-common-dev pylint python3 python3-git python3-jinja2 \
            python3-pexpect python3-pip python3-subunit socat sunxi-tools texinfo \
            unzip wget xterm xz-utils zstd
          sudo locale-gen en_US.UTF-8

      - name: Enable user namespaces for BitBake
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor by default; BitBake needs one for network isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true

      - name: Build Centauri Carbon 1 image
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          TEMPLATECONF="$PWD/meta-opencentauri/conf/templates/opencentauri" \
            source openembedded-core/oe-init-build-env build
          MACHINE=centauri-carbon-1 bitbake ${{ inputs.target }}

      - name: Upload CC1 update bundle
        if: ${{ success() && inputs.upload_all_artifacts && inputs.target == 'cosmos' }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-cosmos-update
          path: build/tmp/deploy/images/centauri-carbon-1/cosmos-centauri-carbon-1.swu
          if-no-files-found: error
          retention-days: 14

      - name: Upload CC1 deployment artifacts
        if: ${{ success() && inputs.upload_all_artifacts && inputs.target != 'cosmos' }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-${{ inputs.target }}
          path: build/tmp/deploy/images/centauri-carbon-1/
          if-no-files-found: error
          retention-days: 14

      - name: Stage BitBake logs on failure
        if: ${{ failure() }}
        run: |
          mkdir -p build/failure-logs
          if [ -d build/tmp/log ]; then
            cp -a build/tmp/log build/failure-logs/
          fi
          if [ -d build/tmp/work ]; then
            find -P build/tmp/work -type f -path '*/temp/log.*' \
              -exec cp --parents -t build/failure-logs {} +
          fi

      - name: Upload BitBake logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-build-logs
          path: build/failure-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Save Yocto downloads and sstate cache
        if: ${{ always() && steps.yocto-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: ${{ steps.yocto-cache.outputs.cache-primary-key }}
