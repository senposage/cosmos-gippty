name: Build CC1 image (GitHub-hosted)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Yocto target to build; cosmos produces the flashable SWUpdate bundle
        required: true
        default: cosmos
        type: choice
        options:
          - cosmos
          - cosmos-image-usb
          - cosmos-image-mmc
      upload_all_artifacts:
        description: Upload the complete CC1 deployment directory
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: write

jobs:
  build:
    # Manual-only: a full Yocto build is resource intensive and should never
    # start merely because a branch was pushed.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BB_NUMBER_THREADS: "4"
      PARALLEL_MAKE: "-j 4"
      DEBIAN_FRONTEND: noninteractive
      # Annotated v1.0.6 tag, resolved to its immutable source commit.  Build
      # the CC1 payload from this source with HelixScreen's own Docker
      # toolchain; do not put the generic published release archive in Yocto.
      HELIXSCREEN_REF: "11230009fa09b4509d0d05f482feaeef2e94c854"

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Reclaim runner disk space
        run: |
          # GitHub-hosted runners are ephemeral.  Keep Yocto's downloads and
          # sstate in the Actions cache below; this only removes preinstalled
          # runner tooling that the CC1 image build does not use.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          sudo docker image prune --all --force
          df -h

      - name: Restore Yocto downloads and sstate cache
        id: yocto-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          # Cache entries are immutable.  A new dispatched run writes an
          # updated entry; restore-keys selects the most recent compatible
          # cache for this CC1 workflow first.
          key: yocto-cc1-v2-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            yocto-cc1-v2-${{ github.sha }}-
            yocto-cc1-v2-

      - name: Restore HelixScreen CC1 compiler cache
        id: helix-cache
        uses: actions/cache/restore@v4
        with:
          path: .helix-ccache
          # The Helix source is pinned, so one immutable cache is reusable for
          # every build of this revision.  v1 keys are a one-time migration
          # fallback and are deleted after a successful v2 save.
          key: helixscreen-cc1-v2-${{ env.HELIXSCREEN_REF }}
          restore-keys: |
            helixscreen-cc1-v2-${{ env.HELIXSCREEN_REF }}
            helixscreen-cc1-v1-${{ env.HELIXSCREEN_REF }}-

      - name: Install Yocto host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            bmap-tools build-essential chrpath cpio debianutils diffstat file \
            gawk gcc git iputils-ping libegl1 liblz4-tool libsdl1.2-dev \
            locales mesa-common-dev pylint python3 python3-git python3-jinja2 python3-yaml \
            python3-pexpect python3-pip python3-subunit socat sunxi-tools texinfo \
            unzip wget xterm xz-utils zstd
          sudo locale-gen en_US.UTF-8

      - name: Build and stage a minimal HelixScreen CC1 payload
        run: |
          git clone --depth 1 --branch v1.0.6 --recurse-submodules --shallow-submodules \
            https://github.com/prestonbrown/helixscreen.git helixscreen-src
          git -C helixscreen-src checkout --detach "${HELIXSCREEN_REF}"
          test "$(git -C helixscreen-src rev-parse HEAD)" = "${HELIXSCREEN_REF}"

          # This is HelixScreen's prescribed CC1 build target.  It owns the
          # Docker context, translations, certificate extraction and the
          # platform's cross-compilation arguments; do not duplicate it here.
          mkdir -p .helix-ccache
          make -C helixscreen-src cc1-docker \
            DOCKER_CCACHE_BASE="$GITHUB_WORKSPACE/.helix-ccache" \
            NPROC_DOCKER_RUN=4

          mkdir -p helixscreen-stage
          make -C helixscreen-src PLATFORM_TARGET=cc1 \
            DESTDIR="$GITHUB_WORKSPACE/helixscreen-stage" install

          # `make install` stages every platform hook as data.  The official
          # Helix installer then selects the detected platform and copies it
          # to platform/hooks.sh, which the SysV init script sources at boot.
          # This image is fixed to CC1, so reproduce that installer step.
          install -d helixscreen-stage/opt/helixscreen/platform
          install -m 0755 \
            helixscreen-stage/opt/helixscreen/assets/config/platform/hooks-cc1.sh \
            helixscreen-stage/opt/helixscreen/platform/hooks.sh
          test -x helixscreen-stage/opt/helixscreen/bin/helix-screen
          test -s helixscreen-stage/opt/helixscreen/platform/hooks.sh

          # The upstream install target packages the whole optional printer-image
          # catalog (77 other printers).  CC1 needs its own image, the two
          # screen-size variants, and the CoreXY fallback.
          image_dir=helixscreen-stage/opt/helixscreen/assets/images/printers
          find "$image_dir" -maxdepth 1 -type f \
            ! -name 'elegoo-centauri-carbon.png' \
            ! -name 'generic-corexy.png' -delete
          # Source-built CC1 staging may omit pre-rendered previews entirely.
          # When present, retain CC1 and generic-CoreXY fallback previews only.
          if [ -d "$image_dir/prerendered" ]; then
            find "$image_dir/prerendered" -type f \
              ! -name 'elegoo-centauri-carbon-150.bin' \
              ! -name 'elegoo-centauri-carbon-300.bin' \
              ! -name 'generic-corexy-150.bin' \
              ! -name 'generic-corexy-300.bin' -delete
          fi

          # cc1-docker statically links HelixScreen's generated LVGL font
          # tables into bin/helix-screen.  `make install` also copies their
          # build inputs (C sources and raw TTFs), but the executable contains
          # no paths to either format.  Keep the CJK .bin files: those are
          # loaded dynamically for translated UI text.  The .icns file is a
          # macOS desktop icon and cannot be used by the CC1 framebuffer UI.
          font_dir=helixscreen-stage/opt/helixscreen/assets/fonts
          find "$font_dir" -maxdepth 1 -type f \( -name '*.c' -o -name '*.ttf' \) -delete
          rm -f helixscreen-stage/opt/helixscreen/assets/images/helix-icon.icns
          # CC1 has no speaker and its Helix build does not compile the tracker
          # player, so its bundled MOD/MED music cannot be played.
          rm -rf helixscreen-stage/opt/helixscreen/assets/sounds

          install -m 0755 helixscreen-src/config/helixscreen.init \
            helixscreen-stage/helixscreen.init
          tar -C helixscreen-stage -czf helixscreen-stage/helixscreen-cc1-built.tar.gz \
            opt/helixscreen helixscreen.init
          test -s helixscreen-stage/helixscreen-cc1-built.tar.gz
          du -sh helixscreen-stage/opt/helixscreen
          ls -lh helixscreen-stage/helixscreen-cc1-built.tar.gz

      - name: Enable user namespaces for BitBake
        run: |
          # Ubuntu 24.04 restricts unprivileged user namespaces through
          # AppArmor by default; BitBake needs one for network isolation.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true

      - name: Build Centauri Carbon 1 image
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8
        run: |
          TEMPLATECONF="$PWD/meta-opencentauri/conf/templates/opencentauri" \
            source openembedded-core/oe-init-build-env build
          MACHINE=centauri-carbon-1 bitbake ${{ inputs.target }}

      - name: Verify CC1 SWUpdate bundle
        if: ${{ success() && inputs.target == 'cosmos' }}
        run: |
          swu=build/tmp/deploy/images/centauri-carbon-1/cosmos-centauri-carbon-1.swu
          test -s "$swu"
          # CC1's inactive A/B squashfs partitions are 128.1 MiB.  Keep an
          # 8 MiB margin so an update cannot overrun the next partition.
          rootfs_member=cosmos-image-mmc-centauri-carbon-1.squashfs
          rootfs_bytes="$(python3 - "$swu" "$rootfs_member" <<'PY'
          import sys

          swu_path, wanted_name = sys.argv[1:]
          with open(swu_path, "rb") as archive:
              while True:
                  header = archive.read(110)
                  if len(header) != 110 or header[:6] not in (b"070701", b"070702"):
                      raise SystemExit("invalid SWUpdate cpio archive")
                  fields = [int(header[6 + index * 8:14 + index * 8], 16) for index in range(13)]
                  file_size, name_size = fields[6], fields[11]
                  name = archive.read(name_size).rstrip(b"\\0").decode("utf-8")
                  archive.seek((-archive.tell()) % 4, 1)
                  if name == wanted_name:
                      print(file_size)
                      break
                  if name == "TRAILER!!!":
                      raise SystemExit(f"{wanted_name} missing from SWUpdate archive")
                  archive.seek(file_size + ((-file_size) % 4), 1)
          PY
          )"
          max_rootfs_bytes=$((120 * 1024 * 1024))
          test "$rootfs_bytes" -le "$max_rootfs_bytes"
          printf 'CC1 rootfs payload: %s bytes (limit: %s bytes)\n' \
            "$rootfs_bytes" "$max_rootfs_bytes"
          file "$swu"
          sha256sum "$swu"

      - name: Upload CC1 update bundle
        if: ${{ success() && inputs.upload_all_artifacts && inputs.target == 'cosmos' }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-cosmos-update
          path: build/tmp/deploy/images/centauri-carbon-1/cosmos-centauri-carbon-1.swu
          if-no-files-found: error
          retention-days: 14

      - name: Upload CC1 deployment artifacts
        if: ${{ success() && inputs.upload_all_artifacts && inputs.target != 'cosmos' }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-${{ inputs.target }}
          path: build/tmp/deploy/images/centauri-carbon-1/
          if-no-files-found: error
          retention-days: 14

      - name: Stage BitBake logs on failure
        if: ${{ failure() }}
        run: |
          mkdir -p build/failure-logs
          if [ -d build/tmp/log ]; then
            cp -a build/tmp/log build/failure-logs/
          fi
          if [ -d build/tmp/work ]; then
            find -P build/tmp/work -type f -path '*/temp/log.*' \
              -exec cp --parents -t build/failure-logs {} +
          fi

      - name: Upload BitBake logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: centauri-carbon-1-build-logs
          path: build/failure-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Bound Yocto cache contents
        id: yocto-cache-prune
        if: ${{ always() }}
        shell: bash
        run: |
          # GitHub does not retain the prior 12 GB cache entry.  Reserve about
          # 6 GiB for Yocto so it coexists with the retained 2.6 GB CC1 compiler
          # cache.  Downloads are kept first; the oldest independent sstate
          # objects are discarded only from this ephemeral runner copy.
          cache_limit_bytes=$((6 * 1024 * 1024 * 1024))
          download_dir=build/downloads
          sstate_dir=build/sstate-cache
          mkdir -p "$download_dir" "$sstate_dir"

          downloads_bytes=$(du -sb "$download_dir" | awk '{print $1}')
          sstate_limit=$((cache_limit_bytes - downloads_bytes))
          if [ "$sstate_limit" -le 0 ]; then
            find -P "$sstate_dir" -type f -delete
          else
            sstate_bytes=$(du -sb "$sstate_dir" | awk '{print $1}')
            if [ "$sstate_bytes" -gt "$sstate_limit" ]; then
              while read -r _modified file_bytes file_path; do
                [ "$sstate_bytes" -le "$sstate_limit" ] && break
                rm -f -- "$file_path"
                sstate_bytes=$((sstate_bytes - file_bytes))
              done < <(find -P "$sstate_dir" -type f -printf '%T@ %s %p\n' | LC_ALL=C sort -n)
              find -P "$sstate_dir" -depth -type d -empty -delete
            fi
          fi

          if find -P "$download_dir" "$sstate_dir" -type f -print -quit | grep -q .; then
            echo "has-files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-files=false" >> "$GITHUB_OUTPUT"
          fi
          du -sh "$download_dir" "$sstate_dir"

      - name: Remove superseded hosted build caches
        # Keep capacity for exactly one bounded Yocto snapshot and one pinned
        # Helix CC1 cache.  The restored cache is already local to this runner,
        # so eviction here cannot affect the build that just consumed it.
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/caches?ref=${GITHUB_REF}&per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("yocto-cc1-v2-") or startswith("helixscreen-cc1-v1-")) | .id' \
            | while read -r cache_id; do
                gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${cache_id}"
              done

      - name: Save Yocto downloads and sstate cache
        if: ${{ always() && steps.yocto-cache.outputs.cache-hit != 'true' && steps.yocto-cache-prune.outputs.has-files == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: ${{ steps.yocto-cache.outputs.cache-primary-key }}

      - name: Save HelixScreen CC1 compiler cache
        if: ${{ always() && steps.helix-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .helix-ccache
          key: ${{ steps.helix-cache.outputs.cache-primary-key }}
